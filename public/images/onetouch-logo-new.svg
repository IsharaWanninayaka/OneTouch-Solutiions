<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Power Ring Icon -->
  <g transform="translate(10, 0)">
    <circle cx="50" cy="50" r="40" stroke="url(#ringGrad1)" stroke-width="14" fill="none" />
    <path d="M 50,10 A 40,40 0 0,1 85,25" stroke="url(#ringGrad2)" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 15,65 A 40,40 0 0,1 20,30" stroke="#0284C7" stroke-width="14" stroke-linecap="round" fill="none" />
    <circle cx="50" cy="50" r="22" fill="url(#innerGrad)" />
    <rect x="46" y="24" width="8" height="24" rx="4" fill="#0066FF" />
    <rect x="47.5" y="26" width="5" height="12" rx="2.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Text -->
  <text x="120" y="58" font-family="'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    <tspan fill="#0F172A">One</tspan><tspan fill="#2563EB">Touch</tspan>
  </text>
  <text x="122" y="82" font-family="'Inter', sans-serif" font-weight="700" font-size="18" fill="#475569" letter-spacing="8">
    SOLUTIONS
  </text>
</svg>
