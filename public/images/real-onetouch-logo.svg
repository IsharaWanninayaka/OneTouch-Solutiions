<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="realBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D70B8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="whiteHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="1.0"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#whiteHalo)">
    <!-- Power Circle Icon -->
    <g transform="translate(10, 6)">
      <!-- Outer Multi-segment Ring -->
      <!-- Top-Right & Bottom-Right Navy Segment -->
      <path d="M 44,9 A 35,35 0 1,1 18,68" stroke="#0B1B3D" stroke-width="11" fill="none" />
      
      <!-- Top-Left Royal Blue Segment -->
      <path d="M 44,9 A 35,35 0 0,0 12,50" stroke="#0066FF" stroke-width="11" stroke-linecap="round" fill="none" />
      
      <!-- Bottom-Left Medium Cyan Segment -->
      <path d="M 12,50 A 35,35 0 0,0 26,73" stroke="#1D70B8" stroke-width="11" stroke-linecap="round" fill="none" />

      <!-- Center Inner Circle -->
      <circle cx="44" cy="44" r="18" fill="#0B1B3D" />

      <!-- Vertical Power Button Bar -->
      <rect x="40.5" y="18" width="7" height="22" rx="3.5" fill="url(#realBlueGrad)" />
      <rect x="42" y="20" width="4" height="11" rx="2" fill="#E0F2FE" />
    </g>

    <!-- Brand Text -->
    <!-- "OneTouch" -->
    <text x="106" y="50" font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
      <tspan fill="#0B1B3D">One</tspan><tspan fill="#1D70B8">Touch</tspan>
    </text>
    
    <!-- "Solutions" -->
    <text x="108" y="75" font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="22" fill="#0B1B3D" letter-spacing="3.5">
      Solutions
    </text>
  </g>
</svg>
