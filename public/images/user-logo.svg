<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="userRingNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04122D" />
      <stop offset="100%" stop-color="#081F3E" />
    </linearGradient>
    <linearGradient id="userRingBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0252C7" />
    </linearGradient>
    <linearGradient id="userRingLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Power Circle Icon -->
  <g transform="translate(8, 4)">
    <circle cx="41" cy="41" r="33" stroke="url(#userRingNavy)" stroke-width="11" fill="none" />
    <path d="M 41,8 A 33,33 0 0,0 10,55" stroke="url(#userRingBlue)" stroke-width="11" stroke-linecap="round" fill="none" />
    <path d="M 66,19 A 33,33 0 0,1 74,41" stroke="url(#userRingLight)" stroke-width="11" stroke-linecap="round" fill="none" />
    <circle cx="41" cy="41" r="18" fill="#04122D" />
    <rect x="37.5" y="18" width="7" height="20" rx="3.5" fill="#0066FF" />
    <rect x="39" y="20" width="4" height="10" rx="2" fill="#E0F2FE" />
  </g>

  <!-- Text -->
  <text x="102" y="47" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5">
    <tspan fill="#04122D">One</tspan><tspan fill="#0066FF">Touch</tspan>
  </text>
  <text x="104" y="71" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="19" fill="#1E293B" letter-spacing="4">
    Solutions
  </text>
</svg>
