<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100">
  <defs>
    <linearGradient id="ringNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04122D" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="ringBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="ringLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Power Circle Icon -->
  <g transform="translate(10, 5)">
    <!-- Main Navy Ring (Bottom & Right) -->
    <circle cx="45" cy="45" r="36" stroke="url(#ringNavy)" stroke-width="12" fill="none" />
    
    <!-- Top-Left Blue Arc -->
    <path d="M 45,9 A 36,36 0 0,0 12,60" stroke="url(#ringBlue)" stroke-width="12" stroke-linecap="round" fill="none" />
    
    <!-- Light Accent Segment -->
    <path d="M 72,21 A 36,36 0 0,1 81,45" stroke="url(#ringLight)" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Center Inner Circle -->
    <circle cx="45" cy="45" r="20" fill="#04122D" />

    <!-- Vertical Power Button Notch -->
    <rect x="41" y="20" width="8" height="22" rx="4" fill="#0066FF" />
    <rect x="42.5" y="22" width="5" height="11" rx="2.5" fill="#E0F2FE" />
  </g>

  <!-- Brand Typography -->
  <!-- "OneTouch" -->
  <text x="110" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5">
    <tspan fill="#04122D">One</tspan><tspan fill="#0066FF">Touch</tspan>
  </text>
  
  <!-- "Solutions" -->
  <text x="112" y="78" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="21" fill="#1E293B" letter-spacing="4.5">
    Solutions
  </text>
</svg>
