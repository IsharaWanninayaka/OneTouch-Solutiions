<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="dmRingBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="dmRingCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="logoDropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Power Circle Icon -->
  <g transform="translate(8, 4)" filter="url(#logoDropGlow)">
    <!-- Outer Multi-segment Ring -->
    <path d="M 41,8 A 33,33 0 1,1 16,66" stroke="#38BDF8" stroke-width="11" fill="none" />
    <path d="M 41,8 A 33,33 0 0,0 10,53" stroke="url(#dmRingCyan)" stroke-width="11" stroke-linecap="round" fill="none" />
    <path d="M 64,18 A 33,33 0 0,1 72,41" stroke="url(#dmRingBlue)" stroke-width="11" stroke-linecap="round" fill="none" />

    <!-- Center Inner Circle -->
    <circle cx="41" cy="41" r="18" fill="#0B0F19" stroke="#38BDF8" stroke-width="2" />

    <!-- Vertical Power Button Bar -->
    <rect x="37.5" y="18" width="7" height="20" rx="3.5" fill="#38BDF8" />
    <rect x="39" y="20" width="4" height="10" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <!-- "OneTouch" -->
  <text x="102" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">One</tspan><tspan fill="#38BDF8">Touch</tspan>
  </text>
  
  <!-- "Solutions" -->
  <text x="104" y="71" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="19" fill="#E2E8F0" letter-spacing="4">
    Solutions
  </text>
</svg>
